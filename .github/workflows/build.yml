name: Build and release
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/CompUsage.App/CompUsage.App.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "The tag must match the application version: v$version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test and package
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CompUsage-${{ steps.version.outputs.value }}-windows-x64
          if-no-files-found: error
          path: |
            artifacts/release/CompUsage-${{ steps.version.outputs.value }}-Setup-x64.exe
            artifacts/release/CompUsage-${{ steps.version.outputs.value }}-portable-x64.zip
            artifacts/release/SHA256SUMS.txt

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CompUsage-${{ needs.windows.outputs.version }}-windows-x64
          path: release
      - name: Verify and publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.windows.outputs.version }}
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "CompUsage $VERSION" --generate-notes
